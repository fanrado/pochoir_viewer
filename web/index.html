<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pochoir viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 13px/1.5 system-ui, sans-serif; }
  #view { display: block; width: 100vw; height: 100vh; }

  #panel {
    position: fixed; top: 12px; left: 12px; width: 220px; padding: 12px;
    background: rgba(255, 255, 255, 0.92); border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);

    /* The panel outgrew a short window once Phases 5, 6, 8, 10, 11 and 13 each
       added controls, so it scrolls instead of running off the bottom.

       It stays on the LEFT rather than reserving top-right clearance: the view
       cube sits in a 96x96 px box inset 12 px from the canvas top-right, and a
       left-hand panel cannot cover it whatever the panel width or window size
       becomes. Reserving 120 px of clearance would instead have to be
       rechecked every time either box changed. */
    box-sizing: border-box;
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    /* MANDATORY. Without this, a wheel event that reaches either end of the
       panel's scroll propagates to the canvas and OrbitControls zooms the
       scene while the user is only trying to scroll the controls. */
    overscroll-behavior: contain;
    /* Hold the width steady as sections appear and disappear, so the layout
       does not reflow when the scrollbar comes and goes. */
    scrollbar-gutter: stable;
  }
  #panel label { display: block; margin-top: 10px; }
  /* touch-action: none keeps a drag on the thumb from panning the scroll
     container instead of moving the slider. Covers #npaths, #zscale,
     #slice-idx and #log-decades alike. */
  #panel input[type=range] { width: 100%; touch-action: none; }
  #panel button { margin-top: 8px; width: 100%; }
  #groups label { margin-top: 4px; }

  /* Section headings stick to the top of the scrollport while their own
     section is in view, so the current section is always named. The
     background must be opaque or scrolled content shows through it. */
  #panel .sec-head {
    position: sticky; top: 0; z-index: 1;
    margin: 0 -12px 6px; padding: 3px 12px;
    font-weight: bold;
    background: #eef0f3; border-bottom: 1px solid #d4d8dd;
  }
  #panel .sec { margin-bottom: 10px; }

  #scale-note { color: #555; }

  #fields { margin-bottom: 10px; }
  #field-radios label { display: block; margin-top: 2px; }
  #modes { margin-top: 8px; }
  #mode-buttons { display: flex; gap: 4px; margin-top: 4px; }
  #contour-controls { margin-top: 8px; border-top: 1px solid #ddd; padding-top: 6px; }
  #contour-legend { color: #444; }
  #scale-controls { margin-top: 8px; }
  #scale-buttons { display: flex; gap: 4px; margin-top: 4px; }
  #contour-scaling { margin-top: 6px; }
  #contour-scaling-buttons { display: flex; gap: 4px; margin-top: 4px; }
  #panel button.layer:disabled { opacity: 0.5; cursor: not-allowed; }
  #contour-status { color: #a05000; min-height: 1em; }
  #colorbar-scale { position: relative; }
  .cb-tick { position: absolute; left: 0; font-size: 10px; color: #444; transform: translateY(-50%); }
  .contour-swatch {
    display: inline-block; width: 10px; height: 10px; border: 1px solid #999;
    vertical-align: middle;
  }

  #layers { margin-bottom: 10px; }
  #layer-buttons { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  #panel button.layer {
    width: auto; flex: 1 1 auto; margin-top: 0; padding: 3px 6px;
    background: #e9e9e9; border: 1px solid #bbb; border-radius: 3px; cursor: pointer;
  }
  #panel button.layer.active { background: #3f6fd0; border-color: #2d54a4; color: #fff; }

  #potential-controls {
    margin-bottom: 10px; border-top: 1px solid #ccc; border-bottom: 1px solid #ccc;
    padding: 8px 0;
  }
  /* white-space: pre-line so a crop warning sits on its own line under the
     extent readout without needing extra markup. */
  #payload-info { color: #555; font-size: 11px; white-space: pre-line; }
  #payload-info.payload-cropped { color: #a05000; font-weight: bold; }
  #axis-radios label { display: inline-block; margin: 0 6px 0 0; }
  #colorbar-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  #colorbar { border: 1px solid #999; }
  #colorbar-scale {
    display: flex; flex-direction: column; justify-content: space-between;
    height: 160px; font-size: 11px; color: #444;
  }

  #shortcuts { margin-top: 12px; border-top: 1px solid #ccc; padding-top: 8px; color: #444; }
  #shortcuts kbd {
    font: 11px monospace; background: #eee; border: 1px solid #bbb;
    border-radius: 3px; padding: 0 3px;
  }

  /* The view cube is NOT a DOM element — it is a scissor viewport drawn
     inside #view at SIZE_PX = 96, INSET_PX = 12 from the top-right
     (viewcube.js:9-10). So this panel clears it at 12 + 96 + 12 = 120px.
     Changing either constant means changing this offset. */
  #current-panel {
    position: fixed; top: 120px; right: 12px; width: 260px; padding: 8px;
    background: rgba(255, 255, 255, 0.92); border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    box-sizing: border-box;
    /* MANDATORY. The cube sits directly above and orbit runs on the whole
       canvas, so a drag starting on the panel's padding or grid gaps would
       otherwise be swallowed here instead of rotating the scene. Only the
       interactive children opt back in. */
    pointer-events: none;
  }
  #current-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 4px;
  }
  /* The 2x2 grid mirrors the pixels in space: the central pixel is at the
     origin corner, the x-neighbour beside it, the y-neighbour below it, and
     the diagonal neighbour opposite. */
  #current-grid canvas {
    width: 100%; height: 60px; display: block;
    background: #fff; border: 1px solid #bbb; border-radius: 3px;
    pointer-events: auto;
  }
  /* One toggle per drift path, laid out as the domain seen down z: the grid's
     columns are i and its rows are j with the largest j on top, so the pattern
     on screen matches the physical seeding rather than a vertical mirror of it.
     Titles gain the start position in mm once the payload is wired (Phase D
     Step 2); the static markup can only know {i, j}. */
  #path-select { margin-top: 6px; }
  #path-grid {
    display: grid; grid-template-columns: repeat(10, 1fr); gap: 1px;
    margin-top: 4px;
  }
  #panel button.path-cell, #path-grid button.path-cell {
    width: auto; margin-top: 0; padding: 0; font-size: 7px; line-height: 14px;
    background: #e9e9e9; border: 1px solid #bbb; border-radius: 2px;
    cursor: pointer; pointer-events: auto; overflow: hidden;
  }
  #path-grid button.path-cell[aria-pressed="true"] {
    background: #3f6fd0; border-color: #2d54a4; color: #fff;
  }
  #path-clear { width: 100%; margin-top: 4px; pointer-events: auto; }

  #current-legend { margin-top: 4px; color: #444; font-size: 11px; }
  .current-swatch {
    display: inline-block; width: 10px; height: 10px; border: 1px solid #999;
    vertical-align: middle;
  }
  #current-play { width: 100%; margin-top: 6px; pointer-events: auto; }

  #readout {
    position: fixed; bottom: 12px; left: 12px; padding: 8px 10px; min-height: 1em;
    background: rgba(255, 255, 255, 0.92); border-radius: 6px; white-space: pre;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<canvas id="view"></canvas>

<div id="panel">
  <div id="fields" class="sec">
    <div class="sec-head">field</div>
    <div id="field-radios">
      <label><input type="radio" name="field" id="field-drift" value="drift" checked> Drift field</label>
      <label><input type="radio" name="field" id="field-weight" value="weight"> Weighting field</label>
    </div>
  </div>

  <div id="layers" class="sec">
    <div class="sec-head">layers</div>
    <div id="layer-buttons" role="group" aria-label="visible layers">
      <button id="layer-paths" class="layer active" aria-pressed="true">Drift paths</button>
      <button id="layer-slice" class="layer" aria-pressed="false">Potential slice</button>
      <button id="layer-boundary" class="layer active" aria-pressed="true">Boundary</button>
    </div>
  </div>

  <div id="potential-controls" hidden>
    <div class="sec-head">potential slice</div>
    <div id="payload-info"></div>
    <div id="axis-radios">
      <label><input type="radio" name="slice-axis" id="axis-x" value="x"> yz (x-slice)</label>
      <label><input type="radio" name="slice-axis" id="axis-y" value="y"> xz (y-slice)</label>
      <label><input type="radio" name="slice-axis" id="axis-z" value="z" checked> xy (z-slice)</label>
    </div>
    <input type="range" id="slice-idx" min="0" max="0" value="0">
    <span id="slice-label"></span>
    <div id="colorbar-row">
      <canvas id="colorbar" width="16" height="160"></canvas>
      <div id="colorbar-scale">
        <span id="colorbar-max"></span>
        <span id="colorbar-min"></span>
      </div>
      <span id="volt-readout"></span>
    </div>
    <div id="modes">
      <b>display</b>
      <div id="mode-buttons" role="group" aria-label="slice display mode">
        <button id="mode-image" class="layer" aria-pressed="false">Image</button>
        <button id="mode-contours" class="layer" aria-pressed="false">Contours</button>
        <button id="mode-both" class="layer active" aria-pressed="true">Both</button>
      </div>
    </div>

    <div id="scale-controls">
      <b>colour scale</b>
      <div id="scale-buttons" role="group" aria-label="colour scale">
        <button id="scale-linear" class="layer active" aria-pressed="true">linear</button>
        <button id="scale-log" class="layer" aria-pressed="false">log</button>
      </div>
      <div id="decades-row" hidden>
        <label for="log-decades">decades <span id="log-decades-label"></span></label>
        <input type="range" id="log-decades" min="2" max="40" step="1" value="8">
      </div>
    </div>

    <div id="contour-controls" class="sec">
      <div class="sec-head">contours</div>
      <button id="layer-contours" class="layer" aria-pressed="false">Contours</button>
      <div id="contour-scaling">
        <b>level scaling</b>
        <div id="contour-scaling-buttons" role="group" aria-label="contour level scaling">
          <button id="scaling-global" class="layer" aria-pressed="false">global</button>
          <button id="scaling-slice" class="layer" aria-pressed="false">per-slice</button>
        </div>
      </div>
      <div id="contour-status"></div>
      <div id="contour-legend"></div>
    </div>
  </div>

  <div id="boundary-controls" class="sec">
    <div class="sec-head">boundary groups</div>
    <div id="groups"></div>
  </div>

  <div id="paths-controls" class="sec">
    <div class="sec-head">paths</div>
    <label for="npaths">paths shown</label>
    <input type="range" id="npaths" min="1" max="100" value="100">
  </div>

  <div id="view-controls" class="sec">
    <div class="sec-head">view</div>
    <label for="zscale">z compression</label>
    <input type="range" id="zscale" min="1" max="40" step="1" value="10">
    <span id="scale-note"></span>

    <button id="reset-scale">x1 (true scale)</button>
    <button id="reset-view">reset view</button>
  </div>

  <div id="pivot-controls" class="sec">
    <div class="sec-head">pivot</div>
    <div id="pivot-readout"></div>
    <button id="center-domain">center on domain</button>
  </div>

  <div id="shortcuts">
    <b>keys</b>
    <div><kbd>1</kbd>–<kbd>6</kbd> axis views (±X, ±Y, ±Z)</div>
    <div><kbd>F</kbd> pivot to geometry under cursor</div>
    <div><kbd>C</kbd> center on domain</div>
    <div><kbd>R</kbd> reset view</div>
  </div>
</div>

<div id="current-panel">
  <b>induced current</b>
  <div id="current-grid">
    <canvas id="current-central" aria-label="central pixel"></canvas>
    <canvas id="current-neighbor-x" aria-label="x-neighbour pixel"></canvas>
    <canvas id="current-neighbor-y" aria-label="y-neighbour pixel"></canvas>
    <canvas id="current-diagonal" aria-label="diagonal neighbour pixel"></canvas>
  </div>
  <div id="path-select">
    <b>paths</b>
    <div id="path-grid" role="group" aria-label="select drift paths">

    <button class="path-cell" data-i="0" data-j="8" aria-pressed="false" title="path (0, 8)">0,8</button><button class="path-cell" data-i="1" data-j="8" aria-pressed="false" title="path (1, 8)">1,8</button><button class="path-cell" data-i="2" data-j="8" aria-pressed="false" title="path (2, 8)">2,8</button><button class="path-cell" data-i="3" data-j="8" aria-pressed="false" title="path (3, 8)">3,8</button><button class="path-cell" data-i="4" data-j="8" aria-pressed="false" title="path (4, 8)">4,8</button><button class="path-cell" data-i="5" data-j="8" aria-pressed="false" title="path (5, 8)">5,8</button><button class="path-cell" data-i="6" data-j="8" aria-pressed="false" title="path (6, 8)">6,8</button><button class="path-cell" data-i="7" data-j="8" aria-pressed="false" title="path (7, 8)">7,8</button><button class="path-cell" data-i="8" data-j="8" aria-pressed="false" title="path (8, 8)">8,8</button><button class="path-cell" data-i="9" data-j="8" aria-pressed="false" title="path (9, 8)">9,8</button>

    <button class="path-cell" data-i="0" data-j="6" aria-pressed="false" title="path (0, 6)">0,6</button><button class="path-cell" data-i="1" data-j="6" aria-pressed="false" title="path (1, 6)">1,6</button><button class="path-cell" data-i="2" data-j="6" aria-pressed="false" title="path (2, 6)">2,6</button><button class="path-cell" data-i="3" data-j="6" aria-pressed="false" title="path (3, 6)">3,6</button><button class="path-cell" data-i="4" data-j="6" aria-pressed="false" title="path (4, 6)">4,6</button><button class="path-cell" data-i="5" data-j="6" aria-pressed="false" title="path (5, 6)">5,6</button><button class="path-cell" data-i="6" data-j="6" aria-pressed="false" title="path (6, 6)">6,6</button><button class="path-cell" data-i="7" data-j="6" aria-pressed="false" title="path (7, 6)">7,6</button><button class="path-cell" data-i="8" data-j="6" aria-pressed="false" title="path (8, 6)">8,6</button><button class="path-cell" data-i="9" data-j="6" aria-pressed="false" title="path (9, 6)">9,6</button>
